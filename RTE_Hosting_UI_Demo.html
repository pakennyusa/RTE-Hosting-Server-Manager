.field{display:flex;flex-direction:column;gap:7px;margin:0 0 16px}.field label,.input-label{font-weight:680;font-size:12px;color:#b7c8dc}.input,.field input,.field select,.field textarea{border:1px solid #34516d;border-radius:11px;background:#0e1828;color:#f1f7ff;min-height:43px;padding:10px 13px;width:100%;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#1b96ff;box-shadow:0 0 0 3px #1b96ff24}.field input::placeholder,.field textarea::placeholder{color:#7892ad}.field select{cursor:pointer}.field textarea{resize:vertical;min-height:100px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid transparent;padding:10px 16px;font-size:13px;font-weight:690;transition:background .18s,border-color .18s,transform .18s;min-height:39px;white-space:nowrap}.btn:hover:not(:disabled){transform:translateY(-1px)}.btn-primary{background:linear-gradient(135deg,#138fff,#176de4);color:#fff;box-shadow:0 5px 18px #0f85fc29}.btn-primary:hover{background:linear-gradient(135deg,#27acff,#187df0)}.btn-secondary{border-color:#355373;background:#16263e;color:#daeafa}.btn-secondary:hover{background:#213854;border-color:#578ab8}.btn-danger{background:#3b1e32;color:#ffabb9;border:1px solid #ff839650}.btn-good{background:#103b34;color:#9cf6d8;border:1px solid #39dfae57}.btn-small{padding:7px 10px;min-height:31px;font-size:12px}.btn-full{width:100%}.hint{font-size:11px;color:var(--muted);line-height:1.55}.inline-error{padding:12px;border:1px solid #f5778b69;background:#c72e4740;color:#ffb0bc;border-radius:10px;margin:10px 0}.linebreak{height:1px;background:var(--line);margin:18px 0}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:#0c1423;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.sidebar .brand{padding:24px 18px 27px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line)}.sidebar .brand img{width:44px;height:44px;border-radius:12px;background:#1a99ff;padding:4px}.sidebar .brand strong{display:block;font-size:16px;font-weight:810;letter-spacing:.015em}.sidebar .brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.17em;text-transform:uppercase;margin-top:3px}.section-label{color:#6f8cad;text-transform:uppercase;letter-spacing:.19em;font-weight:750;font-size:10px;padding:26px 23px 9px}.nav-button{width:calc(100% - 22px);margin:2px 11px;text-align:left;padding:13px;border-radius:10px;background:transparent;border:1px solid transparent;color:#93a8c4;display:flex;align-items:center;gap:12px;font-size:13px;font-weight:660}.nav-button:hover{color:white;background:#1c2b40}.nav-button.active{background:linear-gradient(90deg,#153a62,#172640);color:#b3e3ff;border-color:#2793fd4a}.nav-button svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.nav-spacer{flex:1}.sidebar-foot{margin:16px;border:1px solid #2c4966;background:#111f31;border-radius:13px;padding:14px}.sidebar-foot strong{display:block;font-size:12px}.sidebar-foot small{display:block;color:var(--muted);font-size:11px;margin-top:6px;line-height:1.5}.user-box{border-top:1px solid var(--line);padding:17px;display:flex;align-items:center;gap:12px}.avatar{width:37px;height:37px;display:grid;place-items:center;background:linear-gradient(145deg,#1f80e5,#254c87);border:1px solid #5cb3ff55;border-radius:12px;font-weight:800}.user-box .info{min-width:0;flex:1}.user-box strong{font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis}.user-box small{display:block;color:var(--muted);font-size:11px;text-transform:capitalize;margin-top:3px}

function pageHTML(){switch(state.page){case 'overview':return overviewHTML();case 'servers':return serversHTML();case 'server':return serverHTML();case 'users':return usersHTML();case 'audit':return auditHTML();case 'settings':return settingsHTML();default:return overviewHTML()}}
const titleHTML=(over,h,subtitle,actions='')=>`<div class="heading-row"><div><div class="eyebrow">${over}</div><h1 class="page-title">${h}</h1><p class="subtitle">${subtitle}</p></div><div class="row-actions">${actions}</div></div>`;
function serverList(short=false){const arr=short?state.servers.slice(0,5):state.servers;return `<div class="panel server-list">${arr.length?arr.map(s=>`<div class="server-row"><div class="server-left"><div class="cube">▦</div><div><div class="server-name">${esc(s.name)}</div><div class="server-meta">${esc(s.framework)} ${esc(s.version)} · Port ${s.port} · ${Math.round(s.max_ram/1024*10)/10} GiB max RAM</div></div></div><div class="server-right">${status(s.running)}${button('Manage','open-server','btn-secondary btn-small',`data-id="${s.id}"`)}</div></div>`).join(''):`<div class="empty"><strong>No Minecraft servers configured yet</strong><p>${isStaff()?'Create a server, upload the selected framework’s server files, then accept the Minecraft EULA.':'Your account has not been assigned to any servers yet. Contact RTE Hosting staff.'}</p>${isStaff()?button('Create your first server','create-server','btn-primary'):''}</div>`}</div>`}
function overviewHTML(){const running=state.servers.filter(s=>s.running).length;return `${titleHTML('HOSTING OVERVIEW',`Good to see you, ${esc(state.me.username)}.`, 'Everything you need to manage your Minecraft hosting environment, all in one place.')}
<section class="hero"><div class="kicker">RTE HOSTING · MISSION CONTROL</div><h2>Build. Host. <span class="gradient-text">Explore.</span></h2><p>One platform for vanilla worlds, modded adventures and hybrid plugin frameworks — with clear access controls for staff and customers.</p><div class="hero-actions">${button('View my servers','navigate','btn-primary','data-page="servers"')}${isStaff()?button('+ Deploy a server','create-server','btn-secondary'):''}</div></section>
<div class="stat-grid"><div class="stat"><div class="stat-top">Total servers <span class="stat-icon">▦</span></div><div class="stat-value">${state.servers.length}</div><div class="stat-note">Visible to your account</div></div><div class="stat"><div class="stat-top">Running now <span class="stat-icon">●</span></div><div class="stat-value">${running}</div><div class="stat-note">Live Java processes</div></div><div class="stat"><div class="stat-top">Offline <span class="stat-icon">◷</span></div><div class="stat-value">${state.servers.length-running}</div><div class="stat-note">Available to launch</div></div><div class="stat"><div class="stat-top">Control center <span class="stat-icon">⌘</span></div><div class="stat-value" style="font-size:24px;margin-top:17px">ONLINE</div><div class="stat-note">Local API accessible</div></div></div>
<div class="section-title"><h3>Managed servers</h3>${button('View all','navigate','btn-secondary btn-small','data-page="servers"')}</div>${serverList(true)}<div class="two-col" style="margin-top:16px"><div class="panel"><div class="panel-header"><h3>Supported frameworks</h3></div><div class="panel-body"><div style="display:flex;flex-wrap:wrap;gap:9px">${state.frameworks.map(f=>`<span class="pill">${esc(f)}</span>`).join('')}</div><p class="help-text">Bring your own compatible server distribution. Forge and NeoForge installers typically generate a Windows run.bat file.</p></div></div><div class="panel"><div class="panel-header"><h3>Security first</h3></div><div class="panel-body help-text">Users see only assigned servers. Session-based authentication, anti-CSRF protection and audit events are enabled. The portal listens on localhost by default; use HTTPS reverse proxy for remote customers.</div></div></div>`}
function serversHTML(){return `${titleHTML('WORLD MANAGEMENT','Minecraft Servers','Control your worlds, players and runtime environments.',isStaff()?button('+ Create server','create-server','btn-primary'):'')}${serverList()}`}
function serverHTML(){let s=server();if(!s)return serversHTML();const t=state.tab;return `${titleHTML('MINECRAFT INSTANCE',esc(s.name),`${esc(s.framework)} ${esc(s.version)} · Minecraft Java Edition`,`${button('← All servers','navigate','btn-secondary','data-page="servers"')}${s.can_control?(s.running?button('■ Stop server','stop-server','btn-danger'):button('▶ Start server','start-server','btn-good')):''}`)}
<div class="panel"><div class="panel-body"><div class="detail-grid"><div class="metric">PROCESS STATUS<strong>${status(s.running)}</strong></div><div class="metric">SERVER ADDRESS<strong>localhost:${s.port}</strong></div><div class="metric">MAX MEMORY<strong>${esc(s.max_ram)} MiB</strong></div></div></div></div>
<div class="tab-row">${['overview','console','files','backups','settings'].map(x=>`<button class="tab ${t===x?'active':''}" data-action="tab" data-tab="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
${t==='overview'?serverOverviewHTML(s):t==='console'?consoleHTML(s):t==='files'?filesHTML(s):t==='backups'?backupsHTML(s):propertiesHTML(s)}`}
function serverOverviewHTML(s){return `<div class="two-col"><div class="panel"><div class="panel-header"><h3>Server configuration</h3><small>Instance details</small></div><div class="panel-body"><div class="detail-grid"><div class="metric">Framework<strong>${esc(s.framework)}</strong></div><div class="metric">Minecraft version<strong>${esc(s.version||'Not specified')}</strong></div><div class="metric">Boot strategy<strong>${esc(s.launch_mode)}</strong></div><div class="metric">Startup artifact<strong>${esc(s.launch_mode==='script'?'run.bat':s.jar)}</strong></div><div class="metric">RAM allocation<strong>${s.min_ram}–${s.max_ram} MiB</strong></div><div class="metric">Java runtime<strong>${esc(s.java_path)}</strong></div></div><div class="linebreak"></div><p class="help-text">A server installation is imported using the Files tab. Select the correct server .jar, or use the Windows run.bat generated by Forge / NeoForge.</p>${button('Open server files','tab','btn-secondary','data-tab="files"')}</div></div><div class="panel"><div class="panel-header"><h3>Minecraft End User License Agreement</h3></div><div class="panel-body">${s.eula_accepted?`<span class="pill good">Accepted for this server</span><p class="help-text">This instance is eligible to start once its server runtime files have been uploaded.</p>`:`<span class="pill orange">Acceptance required</span><p class="help-text">Read the <a target="_blank" rel="noopener noreferrer" href="https://aka.ms/MinecraftEULA">Minecraft EULA</a>. You must explicitly agree before this instance can start.</p><label class="checkbox-row"><input type="checkbox" id="eula-checkbox"> I have read and agree to the Minecraft EULA.</label>${button('Accept EULA','accept-eula','btn-primary')}`}</div></div></div>`}
function consoleHTML(s){return `<div class="panel"><div class="panel-header"><h3>Live server console</h3><small>${status(s.running)}</small></div><div class="panel-body">${s.running?'':'<div class="info-banner">Start the server to send console commands. Previous log output can still be viewed.</div>'}<div class="terminal" id="console-output" aria-live="polite">${state.log.length?state.log.map(l=>`<div class="line ${/\b(WARN|ERROR|SEVERE)\b/.test(l)?'warn':''}">${esc(l)}</div>`).join(''):'<span class="muted">Console is empty. Launch a server to see live output.</span>'}</div><form data-form="console" class="console-form"><input class="input" name="command" placeholder="Enter a Minecraft server command…" aria-label="Console command" autocomplete="off" ${!s.running?'disabled':''}><button type="submit" class="btn btn-primary" ${!s.running?'disabled':''}>Send command</button></form><p class="hint">Commands execute with Minecraft console permissions. Only grant console access to trusted users.</p></div></div>`}
function filesHTML(){const dir=state.fileDir;return `<div class="panel"><div class="panel-header"><h3>File manager</h3><small>Server-specific sandbox path</small></div><div class="panel-body"><div class="files-top">${button('↑ Up a directory','files-up','btn-secondary btn-small',`${!dir?'disabled':''}`)}${button('+ New folder','new-folder','btn-secondary btn-small')}${button('↑ Upload file','upload-file','btn-primary btn-small')}</div><div class="path-indicator">/servers/${esc(server()?.name)}/${esc(dir)}</div>${state.files.length?state.files.map(f=>`<div class="file-row"><div class="server-left"><span style="font-size:20px">${f.directory?'▣':'▤'}</span><button class="file-name" data-action="${f.directory?'browse':'file-view'}" data-path="${esc(f.path)}">${esc(f.name)}</button></div><div class="row-actions"><span class="muted small">${f.directory?'Folder':fmtSize(f.size)}</span>${f.directory?'':`<a class="btn btn-secondary btn-small" href="/api/servers/${server().id}/file?path=${encodeURIComponent(f.path)}">↓</a>${button('Delete','delete-file','btn-danger btn-small',`data-path="${esc(f.path)}"`)}`}</div></div>`).join(''):`<div class="empty"><strong>This directory is empty</strong><p>Upload your server files to get started.</p></div>`}<p class="hint">Maximum upload size: 64 MiB per file. Larger server packs can be copied into the server folder locally by authorized hosting staff.</p></div></div>`}
function backupsHTML(){return `<div class="panel"><div class="panel-header"><h3>World backups</h3>${button('+ Create backup','create-backup','btn-primary')}</div><div class="panel-body"><div class="warning-banner">Stop the Minecraft server before creating a backup so world saves stay consistent. Restoring a backup is a staff-managed operation in this release.</div>${state.backups.length?state.backups.map(b=>`<div class="file-row"><div><strong>▤ ${esc(b.name)}</strong><div class="muted small">${fmtSize(b.size)} · ZIP archive</div></div><a class="btn btn-secondary btn-small" href="/api/servers/${server().id}/backup-file?name=${encodeURIComponent(b.name)}">Download</a></div>`).join(''):`<div class="empty"><strong>No backups yet</strong><p>Create an archive to safeguard your server files.</p></div>`}</div></div>`}
function propertiesHTML(s){const p=state.props;return `<div class="panel"><div class="panel-header"><h3>Gameplay settings</h3><small>server.properties · Restart to apply</small></div><div class="panel-body"><form data-form="properties"><div class="form-grid">${field('Message of the day','motd','text',p.motd||'', 'Shown to players browsing multiplayer servers.')}${field('Maximum players','max-players','number',p['max-players']||20,'Allowed: 1–1000.','min="1" max="1000"')}${selectField('Difficulty','difficulty',['peaceful','easy','normal','hard'],p.difficulty||'normal')}${selectField('Player vs player','pvp',[['true','Enabled'],['false','Disabled']],p.pvp||'true')}${isStaff()?selectField('Online authentication','online-mode',[['true','Require Microsoft/Minecraft authentication'],['false','Offline mode (not recommended)']],p['online-mode']||'true'):''}</div><button type="submit" class="btn btn-primary">Save properties</button><p class="hint">Boot parameters and memory assignments are set when staff create the instance. Stop the server before changing world configuration.</p></form></div></div>`}
function usersHTML(){return `${titleHTML('IDENTITY & PERMISSIONS','Team & Access','Provision staff and customers, then grant explicit access to each instance.',button('+ Create account','create-user','btn-primary')+button('Assign server','assign-server','btn-secondary'))}
<div class="info-banner">Customer accounts are limited to their assigned Minecraft servers. Access can be configured separately for power controls, console commands, and server files.</div><div class="panel"><div class="panel-header"><h3>Hosting accounts</h3><small>${state.users.length} users</small></div><div class="panel-body table-scroll"><table class="data-table"><thead><tr><th>Account</th><th>Role</th><th>Assigned servers</th><th>Created</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.username)}</b></td><td>${roleTag(u.role)}</td><td>${state.assignments.filter(a=>a.user_id===u.id).length}</td><td>${esc(u.created_at.slice(0,10))}</td></tr>`).join('')}</tbody></table></div></div><div class="section-title"><h3>Server assignments</h3></div><div class="panel"><div class="panel-body table-scroll">${state.assignments.length?`<table class="data-table"><thead><tr><th>User</th><th>Server</th><th>Power</th><th>Console</th><th>Files</th><th></th></tr></thead><tbody>${state.assignments.map(a=>`<tr><td>${esc(state.users.find(u=>u.id===a.user_id)?.username||'Unknown')}</td><td>${esc(state.servers.find(s=>s.id===a.server_id)?.name||'Unknown')}</td><td>${a.can_control?'Yes':'No'}</td><td>${a.can_console?'Yes':'No'}</td><td>${a.can_files?'Yes':'No'}</td><td>${button('Revoke','revoke-assignment','btn-danger btn-small',`data-user="${a.user_id}" data-id="${a.server_id}"`)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><strong>No customer assignments</strong><p>Assign an account to a server to give it access to the hosting portal.</p></div>`}</div></div>`}
function auditHTML(){return `${titleHTML('OPERATIONAL SECURITY','Audit Trail','A timestamped record of account and server-management actions.')}
<div class="panel"><div class="panel-body table-scroll"><table class="data-table"><thead><tr><th>Time (UTC)</th><th>Account</th><th>Action</th><th>Details</th></tr></thead><tbody>${state.events.map(e=>`<tr><td>${esc(e.created_at.replace('T',' ').slice(0,19))}</td><td><b>${esc(e.actor)}</b></td><td>${esc(e.event.replaceAll('_',' '))}</td><td>${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div></div>`}
function settingsHTML(){return `${titleHTML('OPERATIONS & SUPPORT','Hosting Configuration','Core service information and secure deployment guidance.')}
<div class="two-col"><div class="panel"><div class="panel-header"><h3>Application</h3></div><div class="panel-body"><div class="metric">Product<strong>RTE Hosting Control Center</strong></div><div class="linebreak"></div><div class="metric">Release<strong>Starter ${esc(state.version||'0.1.0')}</strong></div><div class="linebreak"></div><div class="metric">Local portal<strong>${esc(location.origin)}</strong></div><div class="linebreak"></div><div class="metric">Signed in as<strong>${esc(state.me.username)} (${esc(state.me.role)})</strong></div></div></div><div class="panel"><div class="panel-header"><h3>Remote connectivity</h3></div><div class="panel-body help-text"><p><strong>Web portal:</strong> port 8080 is localhost-only by default. For remote access, place HTTPS reverse proxy / SSO or a VPN in front.</p><p><strong>SFTP:</strong> use Windows OpenSSH with dedicated OS accounts and restrictive NTFS permissions. The file manager is built into the web portal.</p><p><strong>RDP:</strong> configure separately on the Windows host for authorized operations staff. Never grant full host RDP to ordinary Minecraft customers.</p><p><strong>Windows installer:</strong> supports branded desktop shortcuts and an embedded desktop webview.</p></div></div></div><div class="warning-banner" style="margin-top:18px">Security boundary: this starter runs Java server executables under the same Windows account as the launcher. Do not grant arbitrary untrusted tenants server installation or upload privileges without isolating each server in its own Windows account, container or VM.</div>`}
function modalHTML(){const m=state.modal;if(!m)return '';let head='',inner='',footer='';if(m.type==='create-server'){head='Create Minecraft server';inner=`<form id="modal-form" data-form="create-server"><div class="form-grid">${field('Server name','name','text','My Minecraft Server','','required minlength="3" maxlength="64"')}${selectField('Server framework','framework',state.frameworks,'Paper')}${field('Minecraft version','version','text','1.21.x')}${field('Game port','port','number','25565','','required min="1024" max="65535"')}${field('Min RAM (MiB)','min_ram','number','1024','','min="256" max="131072"')}${field('Max RAM (MiB)','max_ram','number','4096','','min="256" max="131072"')}${selectField('Launch strategy','launch_mode',[['jar','Executable server JAR (Vanilla/Paper/Fabric/Mohist)'],['script','Windows run.bat (Forge/NeoForge)']])}${field('Server JAR file','jar','text','server.jar','Upload a compatible jar to the root of the new server folder.')}${field('Java executable','java_path','text','java','Use java from PATH, or specify an approved Java installation path.')}</div><div class="info-banner">The manager creates an empty instance. Upload the server distribution and its required libraries afterward. Java and Minecraft binaries are not downloaded automatically.</div></form>`;footer=`<button class="btn btn-secondary" data-action="close-modal">Cancel</button><button class="btn btn-primary" type="submit" form="modal-form">Create instance</button>`}
else if(m.type==='create-user'){head='Provision hosting account';inner=`<form id="modal-form" data-form="create-user">${field('Username','username','text','','','required minlength="3" maxlength="32"')}${field('Temporary password','password','password','','At least 12 characters; share securely.','required minlength="12"')}${selectField('Account role','role',state.me.role==='admin'?['customer','staff','admin']:['customer'])}</form>`;footer=`${button('Cancel','close-modal') }<button class="btn btn-primary" type="submit" form="modal-form">Create account</button>`}
else if(m.type==='assign-server'){head='Assign server access';inner=`<form id="modal-form" data-form="assign-server">${selectField('Customer account','user_id',state.users.map(u=>[u.id,u.username+' ('+u.role+')']))}${selectField('Minecraft server','server_id',state.servers.map(s=>[s.id,s.name]))}<div class="linebreak"></div><label class="checkbox-row"><input type="checkbox" name="can_control" checked> Start / stop server</label><label class="checkbox-row"><input type="checkbox" name="can_console"> Send console commands (privileged)</label><label class="checkbox-row"><input type="checkbox" name="can_files" checked> Manage server files / backups</label></form>`;footer=`${button('Cancel','close-modal')}<button class="btn btn-primary" type="submit" form="modal-form">Save assignment</button>`}
else if(m.type==='new-folder'){head='Create a folder';inner=`<form id="modal-form" data-form="new-folder">${field('Folder name','name','text','','','required maxlength="100"')}</form>`;footer=`${button('Cancel','close-modal')}<button class="btn btn-primary" type="submit" form="modal-form">Create folder</button>`}
else if(m.type==='edit-file'){head='Edit '+esc(m.path);inner=`<form id="modal-form" data-form="edit-file"><div class="field"><label>UTF-8 text editor</label><textarea name="content" rows="16" style="min-height:285px;font:12px Consolas,monospace">${esc(m.content)}</textarea></div></form>`;footer=`${button('Cancel','close-modal')}<button class="btn btn-primary" type="submit" form="modal-form">Save file</button>`}
return `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(head)}"><div class="modal-head"><h2>${head}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">×</button></div><div class="modal-content">${inner}</div><div class="modal-foot">${footer}</div></div></div>`}
function render(){const app=$('#app');app.innerHTML=state.me?shellHTML()+modalHTML():authHTML();document.title='RTE Hosting · '+(state.me?(state.page==='server'?server()?.name:state.page):'Sign in');if(state.page==='server'&&state.tab==='console'){const t=$('#console-output');if(t)t.scrollTop=t.scrollHeight}}
async function reload(){const [list]=await Promise.all([api('/api/servers')]);state.servers=list.servers;if(state.page==='server'&&server())await loadTab();if(state.page==='users')await loadAdmin();if(state.page==='audit')await loadAudit()}
async function loadAdmin(){const [a,b]=await Promise.all([api('/api/admin/users'),api('/api/admin/assignments')]);state.users=a.users;state.assignments=b.assignments}
async function loadAudit(){state.events=(await api('/api/admin/audit')).events}
async function loadTab(){if(!state.sid||!server())return;const p=`/api/servers/${state.sid}`;if(state.tab==='console')state.log=(await api(p+'/console')).lines;else if(state.tab==='files')state.files=(await api(p+'/files?path='+encodeURIComponent(state.fileDir))).files;else if(state.tab==='backups')state.backups=(await api(p+'/backups')).backups;else if(state.tab==='settings')state.props=(await api(p+'/properties')).properties}
async function goto(page){state.page=page;state.modal=null;if(page==='users')await loadAdmin();if(page==='audit')await loadAudit();if(page==='servers'||page==='overview')await reload();render()}
async function detail(id){state.sid=id;state.page='server';state.tab='overview';state.fileDir='';await reload();render()}
async function switchTab(tab){state.tab=tab;await loadTab();render()}
function showModal(type,values={}){state.modal={type,...values};render()}
function dataFromForm(form){const fd=new FormData(form);return Object.fromEntries(fd.entries())}
async function handleSubmit(form){const f=form.dataset.form;const d=dataFromForm(form);
 if(f==='setup'){if(d.password!==d.confirm)throw Error('Passwords do not match.');const r=await api('/api/bootstrap',{method:'POST',body:d});state.me=r.user;state.csrf=r.csrf;state.needsSetup=false;await reload();render();notify('Administrator account created. Welcome to RTE Hosting.');return}
 if(f==='login'){const r=await api('/api/login',{method:'POST',body:d});state.me=r.user;state.csrf=r.csrf;await reload();render();notify('Signed in successfully.');return}
 if(f==='console'){await api(`/api/servers/${state.sid}/command`,{method:'POST',body:{command:d.command}});form.reset();notify('Command sent.');await loadTab();render();return}
 if(f==='properties'){await api(`/api/servers/${state.sid}/properties`,{method:'POST',body:d});notify('Properties saved. Restart your server to apply changes.');await loadTab();render();return}
 if(f==='create-server'){d.port=Number(d.port);d.min_ram=Number(d.min_ram);d.max_ram=Number(d.max_ram);const r=await api('/api/servers',{method:'POST',body:d});state.modal=null;await reload();await detail(r.id);notify('Server instance created. Upload your distribution before starting.');return}
 if(f==='create-user'){await api('/api/admin/users',{method:'POST',body:d});state.modal=null;await loadAdmin();render();notify('Account provisioned.');return}
 if(f==='assign-server'){d.can_control=!!form.querySelector('[name=can_control]').checked;d.can_console=!!form.querySelector('[name=can_console]').checked;d.can_files=!!form.querySelector('[name=can_files]').checked;await api('/api/admin/assignments',{method:'POST',body:d});state.modal=null;await loadAdmin();render();notify('Server permissions saved.');return}
 if(f==='new-folder'){const rel=[state.fileDir,d.name].filter(Boolean).join('/');await api(`/api/servers/${state.sid}/mkdir`,{method:'POST',body:{path:rel}});state.modal=null;await loadTab();render();notify('Folder created.');return}
 if(f==='edit-file'){await api(`/api/servers/${state.sid}/file?path=${encodeURIComponent(state.modal.path)}`,{method:'PUT',body:new Blob([d.content],{type:'text/plain'})});state.modal=null;await loadTab();render();notify('File saved.');return}
}
async function handleAction(el){const act=el.dataset.action;const sid=state.sid;switch(act){
 case 'navigate':await goto(el.dataset.page);break;
 case 'open-server':await detail(el.dataset.id);break;
 case 'tab':await switchTab(el.dataset.tab);break;
 case 'create-server':showModal('create-server');break;
 case 'create-user':showModal('create-user');break;
 case 'assign-server':if(!state.users.length||!state.servers.length){notify('Create a user and a server before assigning access.',true);return}showModal('assign-server');break;
 case 'close-modal':state.modal=null;render();break;
 case 'logout':await api('/api/logout',{method:'POST',body:{}});state.me=null;state.csrf=null;render();break;
 case 'start-server':await api(`/api/servers/${sid}/start`,{method:'POST',body:{}});await reload();render();notify('Server start requested.');break;
 case 'stop-server':if(!confirm('Send the stop command to this Minecraft instance?'))return;await api(`/api/servers/${sid}/stop`,{method:'POST',body:{}});await reload();render();notify('Stop command sent.');break;
 case 'accept-eula':if(!$('#eula-checkbox')?.checked)throw Error('Read and accept the Minecraft EULA first.');await api(`/api/servers/${sid}/eula`,{method:'POST',body:{accepted:true}});await reload();render();notify('EULA acceptance recorded.');break;
 case 'browse':state.fileDir=el.dataset.path;await loadTab();render();break;
 case 'files-up':state.fileDir=state.fileDir.split('/').slice(0,-1).join('/');await loadTab();render();break;
 case 'new-folder':showModal('new-folder');break;
 case 'upload-file':$('#filePicker').click();break;
 case 'file-view':{const path=el.dataset.path;try{const data=await api(`/api/servers/${sid}/text?path=${encodeURIComponent(path)}`);showModal('edit-file',{path,content:data.content})}catch(e){notify(e.message+' Use Download for binary files.',true)}break}
 case 'delete-file':if(!confirm(`Permanently delete ${el.dataset.path}?`))return;await api(`/api/servers/${sid}/file?path=${encodeURIComponent(el.dataset.path)}`,{method:'DELETE'});await loadTab();render();notify('File deleted.');break;
 case 'create-backup':{notify('Creating backup. This can take a while for large worlds.');await api(`/api/servers/${sid}/backups`,{method:'POST',body:{}});await loadTab();render();notify('Backup created.');break}
 case 'revoke-assignment':if(!confirm('Revoke this account’s access to the server?'))return;await api(`/api/admin/assignments?server_id=${encodeURIComponent(el.dataset.id)}&user_id=${encodeURIComponent(el.dataset.user)}`,{method:'DELETE'});await loadAdmin();render();notify('Assignment revoked.');break;
}}
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled)return;ev.preventDefault();try{await handleAction(el)}catch(e){notify(e.message,true)}});
document.addEventListener('submit',async ev=>{const form=ev.target.closest('[data-form]');if(!form)return;ev.preventDefault();const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;try{await handleSubmit(form)}catch(e){notify(e.message,true)}finally{if(submit&&submit.isConnected)submit.disabled=false}});
$('#filePicker').addEventListener('change',async ev=>{const f=ev.target.files?.[0];if(!f)return;try{if(f.size>64*1024*1024)throw Error('Maximum upload size is 64 MiB per file.');const path=[state.fileDir,f.name].filter(Boolean).join('/');await api(`/api/servers/${state.sid}/file?path=${encodeURIComponent(path)}`,{method:'PUT',body:f});await loadTab();render();notify('Upload complete: '+f.name)}catch(e){notify(e.message,true)}finally{ev.target.value=''}});
setInterval(async()=>{if(!state.me||state.modal)return;try{if(state.page==='server'&&state.tab==='console'){const sid=state.sid;const data=await api(`/api/servers/${sid}/console`);if(state.sid!==sid)return;state.log=data.lines;const target=$('#console-output');if(target){const atBottom=target.scrollHeight-target.scrollTop-target.clientHeight<60;target.innerHTML=state.log.map(l=>`<div class="line ${/\b(WARN|ERROR|SEVERE)\b/.test(l)?'warn':''}">${esc(l)}</div>`).join('')||'<span class="muted">No log output.</span>';if(atBottom)target.scrollTop=target.scrollHeight}}}catch(e){/* Explicit interactions report errors; polling is best-effort. */}},2500);
(async function init(){try{const status=await api('/api/bootstrap/status');state.needsSetup=status.needs_setup;state.frameworks=status.frameworks;state.version=status.version;if(!state.needsSetup){try{const me=await api('/api/me');state.me=me.user;state.csrf=me.csrf;await reload()}catch(e){/* no active session */}}render()}catch(e){$('#app').innerHTML=`<div class="empty"><strong>Unable to start RTE Hosting</strong><p>${esc(e.message)}</p></div>`}})();
</script></body></html>
